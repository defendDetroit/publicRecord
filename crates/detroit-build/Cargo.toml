[package]
name = "detroit-build"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Unified build tool for detroit.primals.eco — all layers derive from the same source of truth"
license = "AGPL-3.0-or-later"
homepage = "https://detroit.primals.eco"
repository = "https://git.primals.eco/publicRecord/detroit"

[dependencies]
blake3 = { version = "1.5", default-features = false, features = ["std"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
clap = { version = "4", features = ["derive"] }
csv = "1.3"
litho-core = { path = "../litho-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
# Allow common patterns
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
