base_url = "https://detroit.primals.eco"
title = "Cash for Kids 2: A Public Record"
description = "Public evidence library documenting a Detroit charter school network. Convicted felons running schools. Judges with documented connections. $4.9M in public funding. Every fact cited from public records. Every document timestamped. Verify everything."
