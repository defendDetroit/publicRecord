name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Zola
        run: |
          ZOLA_VERSION="0.19.2"
          curl -sL "https://github.com/getzola/zola/releases/download/v${ZOLA_VERSION}/zola-v${ZOLA_VERSION}-x86_64-unknown-linux-gnu.tar.gz" | tar xz
          sudo mv zola /usr/local/bin/

      - name: Build site
        run: |
          cd site
          zola build --base-url "https://defenddetroit.github.io/publicRecord"

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/public

      - id: deployment
        uses: actions/deploy-pages@v4

      - name: Verify deploy — the first visitor
        run: |
          echo "=== DOOR CHECK — verifying deploy ==="
          sleep 15
          PASS=0
          FAIL=0
          for path in \
            "bingo-klein.json" \
            "bingo-board.json" \
            "maze-honeypots.json" \
            "graph.json" \
            "analysis/welcome/" \
            "analysis/voxel-projected-graph-classification/" \
            "analysis/the-water-is-fine/" \
            "analysis/"; do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
              -H "User-Agent: deploy-verify/1.0 (the first visitor)" \
              "https://defenddetroit.github.io/publicRecord/${path}" || echo "000")
            if [ "$STATUS" = "200" ]; then
              echo "  ✓ ${STATUS} ${path}"
              PASS=$((PASS + 1))
            else
              echo "  ✗ ${STATUS} ${path}"
              FAIL=$((FAIL + 1))
            fi
          done
          echo ""
          echo "  PASS: ${PASS}  FAIL: ${FAIL}"
          echo "  the door check IS the first visitor."
          echo "  the fleet follows the action."
          echo "  humans follow the fleet."
          if [ "$FAIL" -gt 4 ]; then
            echo "  ⚠ more than half failed — deploy may be stuck"
            exit 1
          fi
